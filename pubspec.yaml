name: printlabel
description: "A new Flutter project."

version: 1.0.6+7

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  go_router: ^18.0.2
  dio: ^5.11.1

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.6
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  flutter_barcode_listener: ^0.1.4
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  open_filex: ^4.7.0
  wakelock_plus: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"

flutter:
  uses-material-design: true